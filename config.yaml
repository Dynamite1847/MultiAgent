agent:
  available_instructions:
  - default
  - analyst
  compact_threshold: 0.85
  context_limit: 128000
  instructions: default
  max_turns: 25
context_limit: 60000
context_rounds: 10
default_model: doubao-seed-2-0-pro-260215
default_params:
  frequency_penalty: 0
  max_tokens: 100000
  temperature: 1
  top_p: 1
default_provider: doubao
global_system_prompt: ''
max_single_message_tokens: 30000
om_threshold: 0.7
providers:
  anthropic:
    base_url: https://api.linkapi.ai/v1
    json_format_mode: chat_completions
    models:
    - claude-opus-4-6-thinking
  anthropic1:
    base_url: https://doro.lol/v1
    json_format_mode: chat_completions
    models:
    - claude-opus-4-6
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    json_format_mode: chat_completions
    models:
    - MiniMax-M2.5
    - glm-5.1
    - kimi-k2.5
    - MiniMax/MiniMax-M2.7
  doubao:
    base_url: https://ark.cn-beijing.volces.com/api/v3
    json_format_mode: prompt
    models:
    - doubao-seed-2-0-pro-260215
  google:
    base_url: https://api.linkapi.ai/v1
    json_format_mode: chat_completions
    models:
    - gemini-3.1-pro-preview
  gpt:
    base_url: https://api.linkapi.ai/v1
    json_format_mode: chat_completions
    models:
    - gpt-5.5
  mimo:
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    json_format_mode: chat_completions
    models:
    - mimo-v2.5-pro
  openai:
    base_url: https://api.deepseek.com/v1
    json_format_mode: chat_completions
    models:
    - deepseek-v4-pro
    - deepseek-v4-flash
role_models:
  observer: mimo/mimo-v2.5-pro
  orchestrator: mimo/mimo-v2.5-pro
system:
  log_level: DEBUG
  max_tokens: 32768
  output_dir: ./outputs
  temperature: 0.7
