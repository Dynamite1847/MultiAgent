providers:
  anthropic:
    base_url: https://api.linkapi.ai/v1
    json_format_mode: chat_completions
    models:
    - claude-opus-4-6-thinking
  google:
    base_url: https://api.linkapi.ai/v1
    json_format_mode: chat_completions
    models:
    - gemini-3.1-pro-preview
  openai:
    base_url: https://api.deepseek.com/v1
    json_format_mode: chat_completions
    models:
    - deepseek-reasoner
  doubao:
    base_url: https://ark.cn-beijing.volces.com/api/v3
    json_format_mode: prompt
    models:
    - doubao-seed-2-0-pro-260215
  dashscope:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    json_format_mode: chat_completions
    models:
    - MiniMax-M2.5
    - glm-5
    - kimi-k2.5
    - MiniMax/MiniMax-M2.7
  xiaomi:
    base_url: https://api.xiaomimimo.com/v1
    json_format_mode: chat_completions
    models:
    - mimo-v2-pro
role_models:
  orchestrator: dashscope/glm-5
default_provider: anthropic
default_model: claude-opus-4-6-thinking
global_system_prompt: ''
default_params:
  max_tokens: 100000
  temperature: 1
  top_p: 1
  frequency_penalty: 0
context_strategy: rounds
context_rounds: 10
context_token_threshold: 8000
max_single_message_tokens: 30000
max_total_tokens: 60000
agent:
  max_turns: 25
  context_limit: 128000
  compact_threshold: 0.85
  instructions: default
  available_instructions:
    - default
    - analyst
system:
  log_level: DEBUG
  output_dir: ./outputs
  temperature: 0.7
  max_tokens: 32768

