name: interview
display_name: "用户访谈"
description: "与用户进行结构化多轮对话，深入了解需求细节，作为共创者完善产品设想"
version: "1.0"

when_to_use: |
  - 需要深入了解用户需求的具体细节
  - 任务涉及产品设计，需要确认使用场景、用户群体等
  - 需要多轮对话来完善模糊的想法
  - 需要通过提问来补充缺失的关键信息

input_schema:
  topics:
    type: "list[str]"
    description: "需要访谈的主题列表"
    required: true

output_schema:
  summary:
    type: "string"
    description: "结构化的访谈摘要"

tools_required: []

entry_point: "agents.interview.agent:InterviewAgent"
